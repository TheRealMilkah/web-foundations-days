<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes - Home</title>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Your simple and fast note-taking app</p>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
        </nav>
    </header>
    <main>
        <h2>My Notes</h2>
        <section>
            <h3>Add New Note</h3>
            <form>
                <label for="note-title">Title:</label>
                <input type="text" id="note-title" name="title">
                <br>
                <label for="note-content">Content:</label>
                <textarea id="note-content" name="content"></textarea>
                <br>
                <button type="submit">Add Note</button>
            </form>
        </section>
        <section>
            <h3>Recent Notes</h3>
            <ul>
                <li>Welcome to QuickNotes!</li>
                <li>Remember to stay organized</li>
            </ul>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 QuickNotes</p>
    </footer>
</body>
</html>
