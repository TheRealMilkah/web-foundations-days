<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes - Day 4</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <button id="theme-toggle">Dark mode</button>
  </header>
  <main>
    <label for="note-text">Your note:</label>
    <textarea id="note-text" placeholder="Type your note here..." rows="6"></textarea>
    <div class="counts">
      <p id="char-count">0 / 200 characters</p>
      <p id="word-count">0 words</p>
    </div>
    <button id="clear-btn">Clear</button>
  </main>
</body>
</html>
